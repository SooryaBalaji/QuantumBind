<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumBind | BACE1 Drug Discovery</title>
    <style>
        body {
            background-color: #0d0d0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .main-card {
            background-color: #151518;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 450px;
            text-align: center;
            border: 1px solid #25252a;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* The specific API section you wanted */
        .hardware-config {
            text-align: left;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid #333;
        }

        label {
            color: #00d4ff;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
        }

        .demo-note {
            font-size: 0.7rem;
            color: #666;
            margin-top: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        #results-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #25252a;
            display: none;
        }

        .score-box {
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            display: inline-block;
            width: 80%;
        }

        .score-val {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
        }

        .badge {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>QuantumBind</h1>
        <p class="subtitle">Hybrid VQE & Neural Drug Screener for BACE1</p>

        <div class="hardware-config">
            <label for="api_key">IBM Quantum API Token</label>
            <input type="password" id="api_key" placeholder="Paste your token here...">
            <p class="demo-note">Leave blank to use <b>Demo Mode</b> (Cached Results).</p>
        </div>

        <button id="run-btn" onclick="runHardwarePipeline()">Execute Quantum Pipeline</button>

        <div id="results-container">
            <div class="score-box">
                <span style="color: #888; font-size: 0.8rem;">Binding Affinity Score</span>
                <span id="score-display" class="score-val">0.9009</span>
                <div id="verdict-badge" class="badge">Worth Pursuing</div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
